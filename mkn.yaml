#! clean build test -qdtKw mkn.ram[https] -W 9

name: mkn
version: master
property:
  DATE: 19_AUG_2026
  self.deps: mkn.kul

parent: bin
mode: none

profile:
- name: headers
  inc: inc
  dep: ${self.deps}

- name: compiled
  parent: headers
  if_arg:
    shared: -DMKN_KUL_SHARED -DMKN_KUL_EXPORT
    win_shared: -DYAML_CPP_DLL

- name: bin
  parent: lib
  main: mkn.cpp
  src: src/maiken/create.cpp, -DMKN_VERSION=${version}_${DATE}
  mode: static
  test: |
    test/cpp.cpp
    test/compiler/test_compiler_detection.cpp
    test/compiler/test_command_generator.cpp
  if_arg:
    static: -DYAML_CPP_STATIC_DEFINE
  if_link:
    nix: -rdynamic

- name: lib
  parent: compiled
  dep: parse.yaml
  src: src
  if_link:
    nix: -ldl -pthread
    nix_shared: -rdynamic
    win_cl: -nodefaultlib:libucrt.lib ucrt.lib

- name: static
  parent: bin
  mode: static

# Same as "bin", but links parse.yaml as a shared library instead of static +
# exported (-rdynamic) - used to prove modules (which all take a YAML::Node)
# still dlopen() cleanly when their yaml-cpp dependency is a separate .so
# rather than baked into this binary. See test_mod's mkn.yaml/mod.cpp.
- name: bin_shared
  parent: bin
  mode: none
  dep: parse.yaml[shared]

- name: test_mod
  parent: headers
  with: mkn.mod
  dep:
    - local: test/mod/dep
  src: test/mod/mod.cpp
  out: test_mod
  mode: shared
  if_arg:
    shared: -DMKN_KUL_SHARED
    win_shared: -DYAML_CPP_DLL

- name: test
  src: test/mod/lib.cpp
  out: test
  mod: mkn[test_mod]

- name: server
  parent: lib
  with: io.cereal mkn.ram[https]
  main: server.cpp
  mode: none

- name: format_verbose
  mod:
  - name: clang.format
    version: ${version}
    init:
      style: file
      paths: .

- name: format
  mod: |
    clang.format{init:{style: file, paths: .}}


- name: github
  parent: headers
  dep: parse.yaml
  main: test/github/test.cpp
  with: mkn.ram
