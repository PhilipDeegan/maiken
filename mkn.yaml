#! clean build test -qdtKw mkn.mod,mkn.ram[https] -W 9

name: mkn
version: 0.1.0  # merged into latest: tagged and published, a pre-release (-beta.1) never marked latest
property:
  DATE: 20_NOV_2026
  # dependency versions, only here: master on master, latest on the latest branch, releases pinned in tags
  mkn.kul.version: 0.1.0
  parse.yaml.version: 0.8.0
  mkn.mod.version: 0.1.0
  mkn.ram.version: 0.1.0
  self.deps: mkn.kul#${mkn.kul.version}

parent: bin
mode: none

profile:
- name: headers
  inc: inc
  dep: ${self.deps}

- name: compiled
  parent: headers
  if_arg:
    shared: -DMKN_KUL_SHARED -DMKN_KUL_EXPORT

- name: bin
  parent: lib
  main: mkn.cpp
  src: src/maiken/create.cpp, -DMKN_VERSION=${version}_${DATE}
  mode: static
  test: |
    test/cpp.cpp
    test/compiler/test_compiler_detection.cpp
    test/compiler/test_command_generator.cpp
    test/run/test_run_args.cpp
  if_arg:
    static: -DYAML_CPP_STATIC_DEFINE
  if_link:
    nix: -rdynamic

- name: lib
  parent: compiled
  dep: parse.yaml#${parse.yaml.version}
  src: src
  if_link:
    nix: -ldl -pthread
    nix_shared: -rdynamic
    win_cl: -nodefaultlib:libucrt.lib ucrt.lib

# mkn with dependencies at the versions above: mod as GitHub Actions builds and releases it, full
#  adds the http/2 client (POSIX only, needs OpenSSL); the shebang's -w is for local master builds
- name: mod
  parent: bin
  mode: none  # as the default build: -K/-S decide, not bin's mode: static (a fully static mkn)
  with: mkn.mod#${mkn.mod.version}

- name: full
  parent: mod
  with: mkn.ram#${mkn.ram.version}[https2]

- name: static
  parent: bin
  mode: static

# Same as "bin", but links parse.yaml as a shared library instead of static +
# exported (-rdynamic) - used to prove modules (which all take a YAML::Node)
# still dlopen() cleanly when their yaml-cpp dependency is a separate .so
# rather than baked into this binary. See test_mod's mkn.yaml/mod.cpp.
- name: bin_shared
  parent: mod
  mode: none
  dep: parse.yaml#${parse.yaml.version}[shared]

- name: test_mod
  parent: headers
  with: mkn.mod#${mkn.mod.version}
  dep:
    - local: test/mod/dep
  src: test/mod/mod.cpp
  out: test_mod
  mode: shared
  if_arg:
    shared: -DMKN_KUL_SHARED

- name: test
  src: test/mod/lib.cpp
  out: test
  mod: mkn[test_mod]

- name: server
  parent: lib
  with: io.cereal mkn.ram#${mkn.ram.version}[https]
  main: server.cpp
  mode: none

# include-what-you-use report for inc/ and src/, needs iwyu on PATH, see res/iwyu.imp
- name: iwyu
  parent: bin
  mode: none
  mod:
  - name: cpp.iwyu
    compile:
      paths: inc
      # fragments of maiken/dist.hpp, not standalone headers
      ignore: dist/message.hpp dist/server.hpp
      headers: -x c++-header
      args: -Xiwyu --mapping_file=res/iwyu.imp

- name: format_verbose
  mod:
  - name: clang.format
    version: ${version}
    init:
      style: file
      paths: .

- name: format
  mod: |
    clang.format{init:{style: file, paths: .}}


- name: github
  parent: headers
  dep: parse.yaml#${parse.yaml.version}
  main: test/github/test.cpp
  with: mkn.ram#${mkn.ram.version}
