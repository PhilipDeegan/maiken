name: Production Builds
on:
  push:
    branches: [ master ]
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
      strategy:
        matrix:
          os: [ubuntu-latest, windows-latest]
      runs-on: ${{ matrix.os }}
      steps:
        - uses: actions/checkout@v6
        - if: matrix.os == 'windows-latest'
          run: bash -c "rm /bin/link" # interferes with cl/link.exe
        - if: matrix.os == 'windows-latest'
          uses: ilammy/msvc-dev-cmd@v1
          with:
            arch: amd64
        - if: matrix.os == 'windows-latest'
          shell: cmd
          env:
            MKN_CL_PREFERRED: 1
          run: |
            bash -c ./res/ci/win_build.sh
            mkn build -dtKOgw mkn.mod -a "-std:c++20 -EHsc -DYAML_CPP_STATIC_DEFINE"

        - if: matrix.os == 'ubuntu-latest'
          env:
            MKN_GCC_PREFERRED: 1
          run: |
            ./res/ci/nixish_setup.sh && make nix
            KLOG=3 ./mkn build -dtKw mkn.mod -a "-std=c++20 -fPIC" -O 2 -gW 9 -o mkn_nix

        - if: matrix.os == 'ubuntu-latest'
          uses: actions/upload-artifact@v4.4.0
          with:
            name: maiken-${{ matrix.os }}
            path: bin/build/mkn_nix
            retention-days: 1

        - if: matrix.os == 'windows-latest'
          uses: actions/upload-artifact@v4.4.0
          with:
            name: maiken-${{ matrix.os }}
            path: bin/build/mkn.exe
            retention-days: 1


  build_many_linux:
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    steps:
    - uses: actions/checkout@v6
    - run: ./res/ci/nixish_setup.sh && make nix
    - env:
        MKN_GCC_PREFERRED: 1
      run: KLOG=3 ./mkn build -dtKw mkn.mod -a "-std=c++20 -fPIC" -O 2 -gW 9 -o mkn_manylinux
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: maiken-manylinux-latest
        path: bin/build/mkn_manylinux
        retention-days: 1


  build_many_linux_arm:
    runs-on: ubuntu-26.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64:latest
    steps:
    - uses: actions/checkout@v6
    - run: ./res/ci/nixish_setup.sh && make nix
    - env:
        MKN_GCC_PREFERRED: 1
      run: KLOG=3 ./mkn build -dtKw mkn.mod -a "-std=c++20 -fPIC" -O 2 -gW 9 -o mkn_manylinux_arm
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: maiken-manylinux-arm-latest
        path: bin/build/mkn_manylinux_arm
        retention-days: 1

  build_arm_macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: ./res/ci/nixish_setup.sh && make bsd
    - env:
        MKN_GCC_PREFERRED: 1
      run: KLOG=3 ./mkn build -dtKw mkn.mod -a "-std=c++20 -fPIC" -O 2 -gW 9 -o mkn_arm_osx
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: maiken-macos-latest
        path: bin/build/mkn_arm_osx
        retention-days: 1

  build_arm_linux:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@v6
    - run: ./res/ci/nixish_setup.sh && make nix
    - env:
        MKN_GCC_PREFERRED: 1
      run: KLOG=3 ./mkn build -dtKw mkn.mod -a "-std=c++20 -fPIC" -O 2 -gW 9 -o mkn_arm_linux
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: maiken-ubuntu-arm-latest
        path: bin/build/mkn_arm_linux
        retention-days: 1

  finally:
    name: "Release"
    needs: [build, build_many_linux, build_many_linux_arm, build_arm_macos, build_arm_linux]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v5

    - if: github.event_name != 'release'
      uses: softprops/action-gh-release@v2
      with:
        name: latest
        prerelease: true
        tag_name: latest
        files: |
          maiken-windows-latest/mkn.exe
          maiken-ubuntu-latest/mkn_nix
          maiken-manylinux-latest/mkn_manylinux
          maiken-manylinux-arm-latest/mkn_manylinux_arm
          maiken-macos-latest/mkn_arm_osx
          maiken-ubuntu-arm-latest/mkn_arm_linux

    - if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          maiken-windows-latest/mkn.exe
          maiken-ubuntu-latest/mkn_nix
          maiken-manylinux-latest/mkn_manylinux
          maiken-manylinux-arm-latest/mkn_manylinux_arm
          maiken-macos-latest/mkn_arm_osx
          maiken-ubuntu-arm-latest/mkn_arm_linux
